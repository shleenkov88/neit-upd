<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fbf5f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b141f" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex">
  <meta name="app-version" content="1.2.0">
  <title>УПД и НДС — ООО «Нейт»</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%23e98fb3%27/%3E%3Cstop offset=%271%27 stop-color=%27%237b3a93%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2732%27 height=%2732%27 rx=%279%27 fill=%27url(%23g)%27/%3E%3Cpath d=%27M10 22L22 10%27 stroke=%27white%27 stroke-width=%272.6%27 stroke-linecap=%27round%27/%3E%3Ccircle cx=%2710.5%27 cy=%2710.5%27 r=%272.8%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272.4%27/%3E%3Ccircle cx=%2721.5%27 cy=%2721.5%27 r=%272.8%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272.4%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css?v=1.2.0">
</head>
<body>
  <!-- Шапка -->
  <header class="app-header">
    <div class="wrap brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="30" height="30" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 23 23 9"/><circle cx="10" cy="10" r="2.8"/><circle cx="22" cy="22" r="2.8"/></svg>
      </span>
      <div class="brand-text">
        <h1>УПД и НДС</h1>
        <p class="muted">ООО «Нейт» · ИНН 3702195003 · ОСНО</p>
      </div>
    </div>
  </header>

  <!-- Состояние: «Общая база подключена, вы вошли как …» + кнопка «Выйти» (заполняется из app.js) -->
  <div class="wrap"><div id="statusBar" class="banner status-bar banner-ok" role="status" hidden></div></div>

  <!-- Экраны входа, подтверждения почты и ошибок подключения (заполняются из app.js) -->
  <section id="authScreen" class="wrap" aria-live="polite"></section>

  <!-- Основная часть сайта: видна только после входа -->
  <div id="appShell" hidden>
    <div class="wrap"><div id="migrateBox" hidden></div></div>

    <!-- Выбор периода -->
    <section class="wrap period" aria-label="Период">
      <div class="period-row">
        <label class="field-inline">Год
          <select id="yearSelect" class="input"></select>
        </label>
        <div class="seg" id="quarterSeg" role="group" aria-label="Квартал"></div>
      </div>
      <p id="periodText" class="muted period-text"></p>
    </section>

    <!-- Вкладки -->
    <nav class="tabs" role="tablist" aria-label="Разделы">
      <div class="wrap tabs-inner">
        <button class="tab" role="tab" data-tab="summary" id="tabBtn-summary">Итоги</button>
        <button class="tab" role="tab" data-tab="sale" id="tabBtn-sale">Наши УПД</button>
        <button class="tab" role="tab" data-tab="purchase" id="tabBtn-purchase">УПД поставщиков</button>
        <button class="tab" role="tab" data-tab="data" id="tabBtn-data">Копия данных</button>
      </div>
    </nav>

    <main class="wrap" id="main" tabindex="-1">
      <noscript><p class="banner banner-error">Для работы сайта нужен включённый JavaScript.</p></noscript>
      <div id="view"></div>
    </main>
  </div>

  <footer class="wrap muted footer">
    <p>Версия сайта: <span id="appVersion"></span></p>
    <p>Сайт считает по введённым вами данным и не заменяет бухгалтера. Итоговые суммы перед сдачей отчётности сверяйте с учётной системой.</p>
  </footer>

  <!-- Окна -->
  <dialog id="dlgForm" aria-labelledby="formTitle"></dialog>
  <dialog id="dlgConfirm" aria-labelledby="confirmTitle"></dialog>
  <dialog id="dlgImport" aria-labelledby="importTitle"></dialog>

  <!-- Короткие всплывающие сообщения -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/firebase-config.js?v=1.2.0"></script>
  <script src="js/core.js?v=1.2.0"></script>
  <script src="js/csv.js?v=1.2.0"></script>
  <script src="js/storage.js?v=1.2.0"></script>
  <script src="js/storage-firebase.js?v=1.2.0"></script>
  <script src="js/app.js?v=1.2.0"></script>
</body>
</html>
